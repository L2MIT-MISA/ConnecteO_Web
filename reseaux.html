<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Connecteo — Réseaux</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/png" href="icone.png ">
</head>

<body class="no-pad">

  <header>
    <div class="container1">
      <div class="contained" id="logo_name">
        <div class="mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.6">
            <circle cx="12" cy="12" r="2.4" />
            <circle cx="12" cy="4" r="1.6" />
            <circle cx="19.5" cy="8" r="1.6" />
            <circle cx="19.5" cy="16" r="1.6" />
            <circle cx="12" cy="20" r="1.6" />
            <circle cx="4.5" cy="16" r="1.6" />
            <circle cx="4.5" cy="8" r="1.6" />
            <path d="M12 9.6V5.6M14.1 10.6l4-2.3M14.1 13.4l4 2.3M12 14.4v4M9.9 13.4l-4 2.3M9.9 10.6l-4-2.3" />
          </svg>
        </div>
        <div class="logo">Connecteo</div>
      </div>
      <div class="contained" id="navigation">
        <a href="carte.html">Carte</a>
        <a href="reseaux.html"  class="active">Réseaux</a>
        <a href="messages.html">Messages</a>
        <div class="droite">
          <a href="notification.html" class="notif-bell">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
            <span class="notif-badge">3</span>
          </a>
          <div class="profile-menu">
            <button class="profile-bubble" id="profileToggle">MR</button>
            <div class="profile-dropdown" id="profileDropdown">
              <a href="profil.html">Profil</a>
              <a href="parametres.html">Paramètres</a>
              <hr>
              <a href="#" class="logout">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                  <polyline points="16 17 21 12 16 7" />
                  <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                Déconnexion
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

    <main class="page-content">
        <div class="page-header">
            <h2>Réseaux</h2>
        </div>
        <div class="stats-row">
            <div class="stat-card">
                <div class="num">5</div>
                <div class="lbl">Nœuds actifs</div>
            </div>
            <div class="stat-card">
                <div class="num">2,4 km</div>
                <div class="lbl">Portée du relais le plus loin</div>
            </div>
        </div>
        <div class="list">
            <div class="node-row">
                <div class="node-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M18 20V10M12 20V4M6 20v-6" />
                    </svg>
                </div>
                <div class="node-info">
                    <div class="name">Pylône Nord</div>
                    <div class="sub">1,2 km · relais fixe</div>
                </div>
                <div class="status-dot on"></div>
            </div>
            <div class="node-row">
                <div class="node-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8" />
                    </svg>
                </div>
                <div class="node-info">
                    <div class="name">Relais mobile — R. Andria</div>
                    <div class="sub">400 m · module LoRa</div>
                </div>
                <div class="status-dot on"></div>
            </div>
            <div class="node-row">
                <div class="node-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M18 20V10M12 20V4M6 20v-6" />
                    </svg>
                </div>
                <div class="node-info">
                    <div class="name">Pylône Est</div>
                    <div class="sub">3,1 km · relais fixe</div>
                </div>
                <div class="status-dot off"></div>
            </div>
            <div class="node-row">
                <div class="node-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8" />
                    </svg>
                </div>
                <div class="node-info">
                    <div class="name">Relais mobile — H. Rasoa</div>
                    <div class="sub">860 m · module LoRa</div>
                </div>
                <div class="status-dot on"></div>
            </div>
        </div>
    </main>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth-status.js"></script>
    <script src="js/profile-menu.js"></script>
</body>

</html>
